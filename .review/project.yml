schema_version: "1.0"
project:
  id: thought-drawer
  name: Thought Drawer
  type: mobile-application
  repository_root: "."
  baseline_branch: main
inherits: [android-kotlin]
technology:
  languages: [kotlin]
  frameworks: [android]
  build:
    tool: gradle
scope:
  include:
    - "app/**"
    - "gradle/**"
    - "*.gradle.kts"
    - "gradle.properties"
    - "gradlew"
    - "gradlew.bat"
    - "RELEASE_SIGNING.md"
    - ".review/**"
    - ".github/workflows/**"
  exclude:
    - ".gradle/**"
    - "**/build/**"
    - "**/generated/**"
    - ".idea/**"
    - ".pie/**"
protected_paths: []
commands:
  build: []
  baseline: []
  integration: []
review:
  packs:
    - universal.architecture
    - universal.requirements-traceability
    - universal.test-completeness
    - runtime.performance
gate:
  block_on: [P0, P1]
  require:
    baseline_tests: false
    regression_tests: false
constraints:
  production_changes_allowed: false
  hosted_database_changes_allowed: false
  external_network_allowed: false
